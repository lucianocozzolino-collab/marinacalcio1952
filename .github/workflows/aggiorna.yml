name: Aggiorna risultati

on:
  schedule:
    - cron: "30 * * * 0,1,6"   # ogni ora, sabato/domenica/lunedì (orario UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: "Salva testo e risposte delle pagine in debug/ (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scraper/scrape.py
        env:
          DEBUG: ${{ inputs.debug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: Salva data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json assets/loghi
          git diff --cached --quiet || (git commit -m "Aggiorna risultati" && git push)
