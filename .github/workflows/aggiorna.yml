name: Esegui Scraper e Deploy su Altervista

on:
  push:
    branches:
      - main
  schedule:
    # Esegue lo scraper automaticamente ogni giorno alle 6:00 e alle 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permette di avviare il processo manualmente da GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Recupera il codice dal repository
      uses: actions/checkout@v3

    - name: 🐍 Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 📦 Installa le dipendenze Python
      run: |
        python -m pip install --upgrade pip
        # Se hai un file requirements.txt scommenta la riga sotto:
        # pip install -r marinacalcio1952-main/scraper/requirements.txt
        # Altrimenti installa manualmente le librerie necessarie, ad esempio:
        pip install requests beautifulsoup4

    - name: ⚙️ Esegui lo Scraper dei Comunicati
      run: |
        python scraper/scrape.py

    - name: 🚀 Carica i file su Altervista tramite FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Esclude dal caricamento le cartelle non necessarie al funzionamento del sito online
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/scraper/**
