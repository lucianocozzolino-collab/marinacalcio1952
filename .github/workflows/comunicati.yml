name: Leggi comunicati (giustizia sportiva)

on:
  schedule:
    - cron: "15 */3 * * 3,4,5"   # ogni 3 ore, mercoledi-venerdi (UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: "Salva il testo dei comunicati in debug/ (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python scraper/comunicati.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEBUG: ${{ inputs.debug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
